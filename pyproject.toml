[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ss-seo"
version = "0.1.0"
description = "Evidence-backed SEO intelligence platform"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ss-seo-audit = "ss_seo.cli:main"
ss-seo-server = "ss_seo.server:serve"
